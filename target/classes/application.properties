# Application Configuration
app.name=Gestion Commerciale
app.version=1.0.0
app.author=Système de Gestion Commerciale

# Database Configuration
db.type=sqlite
db.file=gestion_commerciale.db
db.pool.size=10

# UI Configuration
ui.theme=system
ui.font.default=Segoe UI
ui.font.size=12

# Security Configuration
security.password.min.length=6
security.session.timeout=3600

# Business Configuration
business.currency=MAD
business.tax.default=20.0
business.stock.alert.threshold=5
